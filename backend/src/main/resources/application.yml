# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: api-recorder
  
  datasource:
    url: jdbc:mysql://localhost:3306/api_recorder?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useServerPrepStmts=false&cachePrepStmts=false&rewriteBatchedStatements=false
    username: root
    password: first@YD
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        
  security:
    user:
      name: admin
      password: admin

# 日志配置
logging:
  level:
    com.example.api: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# 性能监控配置
app:
  performance:
    monitoring:
      enabled: true  # 是否启用性能监控
      slow-query-threshold: 100  # 慢查询阈值(毫秒)
      log-slow-queries: true     # 是否记录慢查询日志
      log-performance-metrics: true  # 是否在响应中包含性能指标
