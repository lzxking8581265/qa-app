version: '3.8'

services:
  mysql:
    image: registry.cn-beijing.aliyuncs.com/dcap-test-images/api-recorder-mysql:1.0.0
    container_name: api-recorder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: first@YD
      MYSQL_DATABASE: api_recorder
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      api-network:
        ipv4_address: 174.20.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pfirst@YD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: registry.cn-beijing.aliyuncs.com/dcap-test-images/api-recorder-backend:1.0.0
    container_name: api-recorder-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://174.20.0.10:3306/api_recorder?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: first@YD
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      
      # JVM参数配置 - 高并发优化配置
      #JAVA_OPTS: "-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -javaagent:/app/dguard/agent.jar"
      JAVA_OPTS: "-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+OptimizeStringConcat"
      
      # 其他JVM参数配置 - 可通过环境变量修改
      JAVA_HEAP_INITIAL: ${JAVA_HEAP_INITIAL:-256m}
      JAVA_HEAP_MAX: ${JAVA_HEAP_MAX:-512m}
      JAVA_GC_TYPE: ${JAVA_GC_TYPE:--XX:+UseG1GC}
      JAVA_GC_PAUSE: ${JAVA_GC_PAUSE:--XX:MaxGCPauseMillis=200}
      
      # Tomcat连接池配置 - 高并发配置，提升HTTP处理能力
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-400}
      SERVER_TOMCAT_THREADS_MIN_SPARE: ${SERVER_TOMCAT_THREADS_MIN_SPARE:-50}
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-16384}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-200}
      SERVER_TOMCAT_CONNECTION_TIMEOUT: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:-30000}
      
      # 数据库连接池配置 - 高并发配置，提升性能
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-50}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-10}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-30000}
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-600000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:-1800000}
      
      # 应用配置 - 可通过环境变量修改
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_EXAMPLE_API: ${LOGGING_LEVEL_COM_EXAMPLE_API:-INFO}
      
      # 调试配置 - 添加更多日志信息
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
      LOGGING_LEVEL_ORG_HIBERNATE: INFO
      LOGGING_LEVEL_COM_ZAXXER_HIKARI: INFO
      
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /new/dguard/:/app/dguard/:rw
    networks:
      api-network:
        ipv4_address: 174.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep java | grep -v grep > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: registry.cn-beijing.aliyuncs.com/dcap-test-images/api-recorder-frontend:1.0.0
    container_name: api-recorder-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      api-network:
        ipv4_address: 174.20.0.30

networks:
  api-network:
    driver: bridge
    ipam:
      config:
        - subnet: 174.20.0.0/16
          gateway: 174.20.0.1

volumes:
  mysql_data:
    driver: local
